# 需要集群 CNI 支持 NetworkPolicy（Calico/Cilium 等），Flannel 默认不生效。
# 目的：把出站收敛到"数据库 + 向量库 + 模型 + DNS"，避免容器被拿下后成为横向移动跳板。
# 所有 CIDR、端口、命名空间标签都要按实际环境改，下面用占位值。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smarttitu-assistant
      app.kubernetes.io/component: api
  policyTypes: ["Egress"]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 外部 PostgreSQL / Milvus / 模型服务。按实际网段替换 10.0.0.0/8。
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 19530
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 443
---
# 入站只允许 ingress-nginx 命名空间访问 8200，其他来源一律拒绝。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smarttitu-assistant
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8200
