# 两块云盘，不是三块：日志与业务资产分离，同价但容量隔离、快照粒度更细。
#   assistant-var   日志 / 成本报表，可丢，丢了大不了少几天排障记录
#   assistant-data  PDF 提取图片 + 知识源文档，不可丢，需要单独快照
#
# 都是 RWO：应用是单副本，而 conversation_logs 用 flock + os.replace 做
# 会话日志互斥与原子重写，多写者共享存储会出问题（见 README「存储」一节）。
#
# 存储类型是三个环境**唯一**的 PVC 差异，所以在这里定生产基准（云盘），
# 由 dev 覆盖成集群默认 SC。uat 与 prod 共用这个值，但各自在独立命名空间里
# 创建，互不影响。
#
# storageClassName 必须换成集群里云盘 SC 的实际名字（kubectl get sc）。
# 云盘才支持快照，uat/prod 的备份依赖这一点；dev 用默认 SC 即可。
#
# 容量 20Gi 起步：日志 30 天 < 3GiB，图片+文档 < 300MiB。云盘只能扩不能缩。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-var
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "cloud-ssd"
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: "cloud-ssd"
  resources:
    requests:
      storage: 20Gi
