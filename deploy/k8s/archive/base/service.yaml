apiVersion: v1
kind: Service
metadata:
  name: assistant
  labels:
    app.kubernetes.io/name: smarttitu-assistant
spec:
  type: ClusterIP
  # 不需要会话亲和：会话状态在 PostgreSQL，SSE 连接建立后自然粘在同一个 Pod。
  selector:
    app.kubernetes.io/name: smarttitu-assistant
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8200
      targetPort: http
      protocol: TCP
