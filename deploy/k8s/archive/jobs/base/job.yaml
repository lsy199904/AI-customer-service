# 一次性入库任务模板。对应单机版 v3.sh 的：
#   compose run --rm --no-deps -T assistant python manage.py ingest
#
# 不要把它放进 base：每次 apply overlay 都会重建 Job，而 ttl 到期后重建
# 等于又跑一遍入库。入库与重建走 jobs/ingest、jobs/rebuild 两个独立入口。
#
# 注意：ingest 会把 PDF 提取的图片写入共享卷，但应用只在启动时加载一次
# MediaCatalog，所以入库完成后要滚动重启 Deployment 才能引用新图。
apiVersion: batch/v1
kind: Job
metadata:
  name: assistant-ingest
  labels:
    app.kubernetes.io/name: smarttitu-assistant
    app.kubernetes.io/component: ingest
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smarttitu-assistant
        app.kubernetes.io/component: ingest
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: harbor.example.com/ai/smarttitu-assistant:release-20261111
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py"]
          args: ["ingest"]
          envFrom:
            - configMapRef:
                name: assistant-config
            - secretRef:
                name: assistant-secret
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 知识源与 PDF 图片同在 assistant-data 这块 RWO 云盘上，
            # 所以 Job 必须和应用在同一节点，或者在维护窗口先缩容到 0，
            # 否则会卡在 Multi-Attach（见 README「ingest 与卷的互斥」）。
            - name: data
              mountPath: /ai_customer/knowledge_sources
              subPath: knowledge_sources
            - name: data
              mountPath: /ai_customer/var/pdf_media
              subPath: pdf_media
            - name: var-scratch
              mountPath: /ai_customer/var
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: assistant-data
        - name: var-scratch
          emptyDir: {}
        - name: tmp
          emptyDir: {}
