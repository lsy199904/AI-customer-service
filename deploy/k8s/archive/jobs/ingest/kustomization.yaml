apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 增量入库（新增/修改文档）。用法：
#   make ingest          # 等价 kubectl -n <ns> apply -k jobs/ingest
#   kubectl -n smarttitu apply -k deploy/k8s/jobs/ingest
#
# 复用任务模板与同一份配置生成器：
#   ../base            任务定义
#   ../../base/config  ConfigMap（与 overlay 里那份内容一致，名字也一致）
resources:
  - ../base
  - ../../base/config
