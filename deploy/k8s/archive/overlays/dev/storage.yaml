# 三个环境里**唯一**需要改 PVC 的地方。
# base 定的是云盘（生产基准），dev 换成集群默认 SC：本地盘更便宜，
# dev 的数据可丢、也不需要快照。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-var
spec:
  storageClassName: "standard"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assistant-data
spec:
  storageClassName: "standard"
