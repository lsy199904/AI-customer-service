# 与 base 不同的键，SMP 对 ConfigMap 的 data 按键合并。
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-config
data:
  # 每个环境必须不同：最终 collection 名 = 本值 + '_' + fingerprint 前 16 位
  MILVUS_COLLECTION: smarttitu_knowledge_dev

  LOG_DEBUG_CONTENT: "true"
  LOG_DEBUG_RETENTION_DAYS: "1"
  LOG_RETENTION_DAYS: "7"
  # 纯 HTTP 联调时 Cookie 不能带 Secure，否则浏览器丢弃
  ANONYMOUS_COOKIE_SECURE: "false"
  TENANT_MESSAGES_PER_MINUTE: "60"
  FRAME_ORIGINS: "http://localhost:3000"
