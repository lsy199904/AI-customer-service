apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistant
spec:
  tls:
    - hosts:
        - assistant-uat.example.com
      secretName: smarttitu-assistant-uat-tls
  rules:
    - host: assistant-uat.example.com
      http:
        paths:
          - path: /smart-bot
            pathType: Prefix
            backend:
              service:
                name: assistant
                port:
                  number: 8200
