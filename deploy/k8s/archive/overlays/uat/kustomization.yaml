apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 验收/预发环境：配置与 prod 尽量一致，只隔离数据和域名。
# 用途是上线前用真实证书、真实平台域名跑一遍，避免"dev 能跑、线上不行"。
#   make apply ENV=uat
namespace: smarttitu-uat

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: config-patch.yaml
  - path: ingress-patch.yaml

images:
  - name: harbor.example.com/ai/smarttitu-assistant
    newTag: uat
