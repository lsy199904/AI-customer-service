# 只写与 base 不同的键；模型地址、Milvus 地址若与 base 占位一致就无需重复。
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-config
data:
  MILVUS_COLLECTION: smarttitu_knowledge

  FRAME_ORIGINS: "https://portal.smarttitu.cn"
  ANONYMOUS_COOKIE_SECURE: "true"
  LOG_DEBUG_CONTENT: "false"
  LOG_RETENTION_DAYS: "30"
  TENANT_MESSAGES_PER_MINUTE: "20"
