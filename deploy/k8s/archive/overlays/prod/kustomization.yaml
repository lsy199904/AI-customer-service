apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 生产环境：单副本 + 云盘（RWO）+ 真实域名。
#   make diff ENV=prod
#   make apply ENV=prod
namespace: smarttitu

resources:
  - ../../base
  - namespace.yaml

patches:
