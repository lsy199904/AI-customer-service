apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 开发环境：单副本、集群默认存储、不启 TLS、打开正文日志。
#   make apply ENV=dev
namespace: smarttitu-dev

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: config-patch.yaml
  - path: storage.yaml
  - path: ingress-patch.yaml

images:
  - name: harbor.example.com/ai/smarttitu-assistant
    newTag: dev
