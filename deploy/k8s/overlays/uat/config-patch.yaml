# UAT 与 prod 的配置差异应该只剩"域名、collection 前缀、日志保留期"。
# 任何其它差异都会让验收失去意义。
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-config
data:
  MILVUS_COLLECTION: smarttitu_knowledge_uat

  LOG_DEBUG_CONTENT: "false"
  LOG_RETENTION_DAYS: "14"
  ANONYMOUS_COOKIE_SECURE: "true"
  TENANT_MESSAGES_PER_MINUTE: "20"
  FRAME_ORIGINS: "https://portal-uat.smarttitu.cn"
