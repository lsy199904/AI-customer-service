# 集群内入口：Ingress（75-ingress.yml）与其它工作负载统一走 titu-assistant.app-zone.svc:8201。
# 对外暴露不再使用 NodePort：本集群 Cilium 开了 kubeProxyReplacement 且 devices 只有 eth1，
# nodePort 的 BPF 不覆盖对外网卡 eth0，外网访问会被 RST（详见 README「对外访问」）。
apiVersion: v1
kind: Service
metadata:
  name: titu-assistant
  namespace: app-zone
  labels:
    app.kubernetes.io/name: titu-assistant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: titu-assistant
  ports:
    - name: http
      port: 8201
      targetPort: http
