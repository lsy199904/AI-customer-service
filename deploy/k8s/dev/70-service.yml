# 集群内服务：ClusterIP，仅供 Ingress（80-ingress.yml）和集群内排障访问。
#   集群内：titu-assistant.app-zone.svc:8201（端口名 http）
# 对外入口走 Ingress（IP + http），见 80-ingress.yml；不再用 NodePort，
# 节点无需放通端口，Cilium devices 需覆盖外网网卡的问题也随之消失。
apiVersion: v1
kind: Service
metadata:
  name: titu-assistant
  namespace: app-zone
  labels:
    app.kubernetes.io/name: titu-assistant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: titu-assistant
  ports:
    - name: http
      port: 8201
      targetPort: http
