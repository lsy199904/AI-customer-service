# 对外入口：NodePort 30201 → 容器 8201（端口名 http）。
#   http://<任一节点 IP>:30201/smart-bot/     （应用自带 PublicPrefix 中间件，不带 /smart-bot 前缀也可）
# nodePort 显式写死，避免集群随机分配后防火墙规则/书签跟着变；换端口要同步改这里与放行规则。
# 前提：节点网络需放通 30201/TCP。本集群 Cilium 开了 kubeProxyReplacement，NodePort 的 BPF 只挂在
# devices 列出的网卡上；若 devices 只有 eth1，则外网网卡 eth0 进来的包会被 RST，
# 需把 HelmChartConfig rke2-cilium 的 devices 改为 eth0,eth1（命令见 dev README「对外访问」）。
apiVersion: v1
kind: Service
metadata:
  name: titu-assistant
  namespace: app-zone
  labels:
    app.kubernetes.io/name: titu-assistant
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: titu-assistant
  ports:
    - name: http
      port: 8201
      targetPort: http
      nodePort: 30201
