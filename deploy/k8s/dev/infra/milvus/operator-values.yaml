# ============================================================
# Milvus Operator v1.3.7 —— Helm 覆盖配置
# 用法：
#   helm install milvus-operator \
#     -n milvus-operator --create-namespace \
#     --wait --wait-for-jobs \
#     -f operator-values.yaml \
#     https://github.com/zilliztech/milvus-operator/releases/download/v1.3.7/milvus-operator-1.3.7.tgz
# ============================================================

# 【重要】镜像改为私有仓库
# 背景：集群节点无法直连 Docker Hub（registry-1.docker.io 被 DNS 污染），
#       必须先把 Operator 镜像同步到 harbor，否则 Pod 会 ImagePullBackOff。
# 同步步骤（在能上网的机器上，用加速器）：
#   docker pull docker.m.daocloud.io/milvusdb/milvus-operator:v1.3.7
#   docker tag docker.m.daocloud.io/milvusdb/milvus-operator:v1.3.7 harbor.rd.dsi/docker.io/milvusdb/milvus-operator:v1.3.7
#   docker push harbor.rd.dsi/docker.io/milvusdb/milvus-operator:v1.3.7
image:
  repository: harbor.rd.dsi/docker.io/milvusdb/milvus-operator
  tag: "v1.3.7"
  pullPolicy: IfNotPresent

# 【按需】若 harbor 开启认证，先创建 secret 再取消注释：
#   kubectl create secret docker-registry harbor-regcred -n milvus-operator \
#     --docker-server=harbor.rd.dsi --docker-username=<user> --docker-password=<pass>
# imagePullSecrets:
#   - name: harbor-regcred

# 【可选】生产建议 2 副本实现高可用（chart 默认 1）
replicaCount: 2

# 【默认值】一般无需修改
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 100Mi

# 【注意】为 true 时，卸载 Operator 会删除 CRD，连带删除所有 Milvus 实例。
# 卸载前请先备份：kubectl get milvus -A -o yaml > milvus-backup.yaml
installCRDs: true

# 默认关闭，普通场景无需开启（开启需 cert-manager）
enableWebhook: false
cert-manager:
  enabled: false

# 【可选】固定调度到 CPU 工作节点（管理节点已有 CriticalAddonsOnly NoExecute 污点）
# nodeSelector:
#   node-type: cpu
