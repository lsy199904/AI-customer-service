# 数据库 SQL 执行任务（Flyway）：在 App 滚动前运行一次。
# 由 deploy/k8s/run-db-migrate.sh 删除旧 Job、重新 apply 并等待完成。
# namespace 不写死，由 kubectl -n <namespace> 指定。
# 幂等：Flyway migrate 在 schema 已是最新时为 no-op；重复执行不会重复建表。
apiVersion: batch/v1
kind: Job
metadata:
  name: titu-db-migrate
  labels:
    app.kubernetes.io/name: titu-assistant
    app.kubernetes.io/component: db-migrate
    smarttitu-role: maintenance
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: titu-assistant
        app.kubernetes.io/component: db-migrate
        smarttitu-role: maintenance
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: flyway
          image: harbor.rd.dsi/smarttitu/db-migrate:v1.2.0   # 与 App 同 commit/tag 构建；CI 写入
          imagePullPolicy: IfNotPresent
          args: ["-connectRetries=10", "migrate"]
          env:
            - { name: FLYWAY_URL, valueFrom: { secretKeyRef: { name: titu-assistant-secret, key: FLYWAY_URL } } }
            # 归属凭证占位符：V1.0.0 凭证行与 beforeMigrate 回调引用；与 App 配置同源
            - { name: FLYWAY_PLACEHOLDERS_DEPLOYMENT_ID,   valueFrom: { configMapKeyRef: { name: titu-assistant-config, key: DEPLOYMENT_ID } } }
            - { name: FLYWAY_PLACEHOLDERS_MILVUS_URI,      valueFrom: { configMapKeyRef: { name: titu-assistant-config, key: MILVUS_URI } } }
            - { name: FLYWAY_PLACEHOLDERS_MILVUS_DATABASE, valueFrom: { configMapKeyRef: { name: titu-assistant-config, key: MILVUS_DATABASE } } }
            - { name: FLYWAY_PLACEHOLDERS_MILVUS_PREFIX,   valueFrom: { configMapKeyRef: { name: titu-assistant-config, key: MILVUS_COLLECTION } } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
