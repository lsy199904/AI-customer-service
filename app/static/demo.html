<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SmartTITU · 悬浮客服演示</title><link rel="stylesheet" href="/widget/demo.css"></head>
<body>
<main>
  <div class="eyebrow">SMARTTITU / ASSISTANT MVP</div>
  <h1>一个入口，<br>解答每一个问题。</h1>
  <p class="lead">客服按钮与对话窗口由服务自动提供。<br>点击右下角，即可开始体验知识问答。</p>
  <section class="card">
    <div class="step">01 / 连接企业身份</div>
    <h2>输入本地测试凭证</h2>
    <p>在服务终端使用 <code>python3 manage.py token --tenant demo --user tester</code> 生成短期凭证，然后粘贴到这里。</p>
    <label for="token">Bearer 凭证（仅保留在本页内存）</label>
    <textarea id="token" rows="3" autocomplete="off" spellcheck="false" placeholder="粘贴凭证，不需要 Bearer 前缀"></textarea>
    <button id="connect">连接并打开客服 ↗</button><span id="status" role="status"></span>
    <p class="hint">问答使用服务端配置的知识库和模型。请先完成知识入库；无需在此页面填写模型密钥。</p>
  </section>
  <div class="features"><span>文档语义知识库</span><span>可追溯来源</span><span>人工联系指引</span></div>
</main>
<script src="/widget.js" defer></script><script src="/widget/demo.js" defer></script>
</body></html>
