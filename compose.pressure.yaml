# Separate process/port; model services and PostgreSQL/Milvus remain shared.
services:
  assistant:
    image: ai_customer-assistant:v3
    pull_policy: never
    env_file: .env
    network_mode: host
    user: "${ASSISTANT_UID:?use pressure.sh}:${ASSISTANT_GID:?use pressure.sh}"
    working_dir: /ai_customer
    environment:
      HOST: 127.0.0.1
      PORT: "18200"
      DEMO_AUTO_LOGIN: "false"
      LOG_DIR: /ai_customer/var/logs
      DATABASE_PATH: /ai_customer/var/assistant.db
      RAG_INDEX_PATH: /ai_customer/var/rag.sqlite3
      KNOWLEDGE_SOURCE_DIR: /ai_customer/knowledge_sources
    volumes: [".:/ai_customer"]
    restart: "no"
    stop_grace_period: 190s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18200/ready',timeout=10)"]
      interval: 10s
      timeout: 12s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
