# =====================================================================
# Flyway 配置（仅非敏感默认值）
#
# 连接信息（FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD）与部署归属占位符
# 一律经环境变量注入，不写入本文件，也不提交任何真实凭证。
#
# 目录布局（不要随意调整）：
#   deploy/docker/Dockerfile.dbmigrate 只复制两项：
#     database/postgres/flyway.conf  -> /flyway/conf/flyway.conf
#     database/postgres/migrations   -> /flyway/migrations
#   迁移镜像是整棵 migrations 树复制，因此：
#     migrations/callbacks/   放 before/afterMigrate 回调（callbackLocations 显式指定）
#     migrations/repeatable/  放 R__ 可重复迁移（locations 递归扫描）
#     migrations/<domain>/    放领域版本化迁移（locations 递归扫描）
#   这些子目录不能提升到 database/postgres 顶层，否则不会进入迁移镜像。
# =====================================================================

# 迁移脚本位置：容器内工作目录为 /flyway，故相对路径即 /flyway/migrations
# Flyway 会递归扫描该目录；版本顺序只由版本号决定，目录只用于业务分组。
flyway.locations=filesystem:migrations

# 回调位置：显式指定，避免与版本化迁移混放
flyway.callbackLocations=filesystem:migrations/callbacks

# 结构与知识元数据分属两个 schema；history 表放在 assistant
flyway.schemas=assistant,knowledge
flyway.defaultSchema=assistant
flyway.table=flyway_schema_history
flyway.encoding=UTF-8

# 每次 migrate 先校验已应用脚本的 checksum 与顺序
flyway.validateOnMigrate=true
# 不输出迁移脚本中 SELECT 的结果表（如检查点迁移 5 的 SELECT 1），减少日志噪声
flyway.outputQueryResults=false
# 禁止乱序应用：版本号必须单调递增，避免不同环境顺序不一致
flyway.outOfOrder=false
# 版本回退时，库中可能存在“未来”迁移；忽略它们，使旧镜像的 migrate 能通过并 no-op。
# 该配置只保证校验通过，不保证语义兼容——迁移仍需遵守“兼容 N-1”纪律。
flyway.ignoreMigrationPatterns=*:future
# locations 配错时立即失败，避免“空迁移成功”的假象
flyway.failOnMissingLocations=true

# clean 会删除 assistant/knowledge 两个 schema，永久禁用
flyway.cleanDisabled=true

# 存量环境只允许人工 baseline；禁止自动收编非空未登记库
flyway.baselineOnMigrate=false
flyway.baselineVersion=1.0.0
flyway.baselineDescription=1.0.0 schema

# 多 Pod 同时启动时，Flyway 通过 PostgreSQL advisory lock 串行化；
# 拿不到锁时重试，避免 Init 容器因瞬时竞争直接失败。
flyway.lockRetryCount=120

# ---------------------------------------------------------------------
# 部署归属占位符
#
# V1.0.0__baseline.sql 第五节与 beforeMigrate__verify_identity.sql 引用：
#   ${deployment_id} / ${milvus_uri} / ${milvus_database} / ${milvus_prefix}
#
# 对应环境变量（Flyway 约定：FLYWAY_PLACEHOLDERS_ + 大写占位符名）：
#   FLYWAY_PLACEHOLDERS_DEPLOYMENT_ID
#   FLYWAY_PLACEHOLDERS_MILVUS_URI
#   FLYWAY_PLACEHOLDERS_MILVUS_DATABASE
#   FLYWAY_PLACEHOLDERS_MILVUS_PREFIX
#
# 约束：
#   1. 值必须与 App 的 DEPLOYMENT_ID / MILVUS_URI / MILVUS_DATABASE /
#      MILVUS_COLLECTION 完全一致（URI 比较时会 rstrip('/')）；
#   2. 不得包含单引号；
#   3. 缺失时 migrate 直接报错（Flyway 内建防呆）；
#   4. baseline / validate / info 不执行迁移语句，无需提供占位符。
#
# 归属校验：beforeMigrate__verify_identity.sql 在每次 migrate 前比对
# external_deployment 凭证行与上述占位符；不一致即拒绝迁移。全新库
# （表未建）自动放行，由 V1.0.0 建表并写入凭证行。
# ---------------------------------------------------------------------
