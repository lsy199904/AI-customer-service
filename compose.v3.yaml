name: ai_customer_v3
services:
  assistant:
    image: ai_customer-assistant:v3
    build: .
    env_file: .env
    network_mode: host
    user: "${ASSISTANT_UID:?use v3.sh}:${ASSISTANT_GID:?use v3.sh}"
    working_dir: /ai_customer
    environment:
      HOST: "${V3_HOST:-0.0.0.0}"
      PORT: "${V3_PORT:-8200}"
      ANONYMOUS_WIDGET_ENABLED: "${ANONYMOUS_WIDGET_ENABLED:-false}"
      DEMO_AUTO_LOGIN: "true"
      SESSION_RETENTION_DAYS: "7"
      LOG_DIR: /ai_customer/var/logs
      DATABASE_PATH: /ai_customer/var/assistant.db
      RAG_INDEX_PATH: /ai_customer/var/rag.sqlite3
      KNOWLEDGE_SOURCE_DIR: /ai_customer/knowledge_sources
    volumes: [".:/ai_customer"]
    restart: unless-stopped
    stop_grace_period: 190s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/ready',timeout=10)"]
      interval: 20s
      timeout: 12s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
