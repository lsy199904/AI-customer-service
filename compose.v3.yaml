# Linux独立部署入口；模型服务由外部提供。配置来自.env。
x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.10-bookworm}
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run v3.sh init}
      POSTGRES_DB: ${POSTGRES_DB:?run v3.sh init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run v3.sh init}
      APP_DB_USER: ${APP_DB_USER:?run v3.sh init}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run v3.sh init}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-assistant.sh:ro
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.18}
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: ["etcd-data:/etcd"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-05-28T17-19-04Z}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run v3.sh init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run v3.sh init}
    command: ["minio", "server", "/minio_data"]
    volumes: ["minio-data:/minio_data"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.4}
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run v3.sh init}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run v3.sh init}
    ports: ["127.0.0.1:${MILVUS_PORT:-19530}:19530"]
    volumes:
      - milvus-data:/var/lib/milvus
      - ./deploy/generated/milvus-user.yaml:/milvus/configs/user.yaml:ro
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      start_period: 90s
      interval: 15s
      timeout: 10s
      retries: 20
  assistant:
    image: ${ASSISTANT_IMAGE:-smarttitu-assistant:release-20261111}
    build: .
    env_file: .env
    network_mode: host
    user: "${ASSISTANT_UID:?use v3.sh}:${ASSISTANT_GID:?use v3.sh}"
    working_dir: /ai_customer
    environment:
      HOST: "${V3_HOST:-127.0.0.1}"
      PORT: "${V3_PORT:-8200}"
      ANONYMOUS_WIDGET_ENABLED: "${ANONYMOUS_WIDGET_ENABLED:-true}"
      SESSION_RETENTION_DAYS: "${SESSION_RETENTION_DAYS:-7}"
      LOG_DIR: /ai_customer/var/logs
      DATABASE_PATH: /ai_customer/var/assistant.db
      RAG_INDEX_PATH: /ai_customer/var/rag.sqlite3
      KNOWLEDGE_SOURCE_DIR: /ai_customer/knowledge_sources
      PDF_MEDIA_DIR: /ai_customer/var/pdf_media
      MEDIA_PATH: /ai_customer/data/media.json
    volumes: [".:/ai_customer"]
    depends_on:
      postgres: {condition: service_healthy}
      milvus: {condition: service_healthy}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 190s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/ready',timeout=10)"]
      start_period: 30s
      interval: 20s
      timeout: 12s
      retries: 3
volumes:
  postgres-data:
  etcd-data:
  minio-data:
  milvus-data:
