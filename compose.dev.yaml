# Existing PG / Milvus and external model APIs. Starts the application only.
services:
  assistant:
    image: ${ASSISTANT_IMAGE:-smarttitu-assistant:external-20261116}
    build: .
    env_file: .env
    network_mode: host
    user: "${ASSISTANT_UID:?use scripts/dev.sh}:${ASSISTANT_GID:?use scripts/dev.sh}"
    working_dir: /ai_customer
    environment:
      HOST: "${APP_HOST:-127.0.0.1}"
      PORT: "${APP_PORT:-8201}"
      LOG_DIR: /ai_customer/var/logs
      DATABASE_PATH: /ai_customer/var/assistant.db
      RAG_INDEX_PATH: /ai_customer/var/rag.sqlite3
      KNOWLEDGE_SOURCE_DIR: /ai_customer/knowledge_sources
      PDF_MEDIA_DIR: /ai_customer/var/pdf_media
      MEDIA_PATH: /ai_customer/data/media.json
    volumes: [".:/ai_customer"]
    restart: unless-stopped
    stop_grace_period: 190s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/smart-bot/ready',timeout=10)"]
      start_period: 40s
      interval: 15s
      timeout: 12s
      retries: 12
