<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="915" viewBox="0 0 1080 915"><rect width="1080" height="915" fill="white"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#183153}.title{font-size:34px;font-weight:600}.label{font-size:27px;font-weight:600}.body{font-size:24px}</style><text x="540" y="55" text-anchor="middle" class="title">在线签约流程</text><rect x="55" y="90" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="125" text-anchor="middle" class="label">1 进入签约管理</text><text x="540" y="162" text-anchor="middle" class="body">前提：已完成企业认证</text><text x="540" y="192" text-anchor="middle" class="body">【服务合约】→【签约管理】→【新增签约】</text><path d="M540 218v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="245" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="280" text-anchor="middle" class="label">2 核对签约信息</text><text x="540" y="317" text-anchor="middle" class="body">甲方、乙方、模板、经办人手机号齐全</text><path d="M540 373v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="400" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="435" text-anchor="middle" class="label">3 发起并完成签署</text><text x="540" y="472" text-anchor="middle" class="body">【发起签署】→e签宝新窗口→核对合同并签署</text><text x="540" y="502" text-anchor="middle" class="body">发起失败按错误提示处理后重试</text><path d="M540 528v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="555" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="590" text-anchor="middle" class="label">4 查看合同状态</text><text x="540" y="627" text-anchor="middle" class="body">“签署中”：等待签署或平台用印审批</text><text x="540" y="657" text-anchor="middle" class="body">“已完成”：合同生效，可下载与验签</text><path d="M540 683v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="710" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="745" text-anchor="middle" class="label">5 继续订购服务</text><text x="540" y="782" text-anchor="middle" class="body">合同完成后办理订购，到【我的服务】查看生效</text></svg>