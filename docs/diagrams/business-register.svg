<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><rect width="1080" height="760" fill="white"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#183153}.title{font-size:34px;font-weight:600}.label{font-size:27px;font-weight:600}.body{font-size:24px}</style><text x="540" y="55" text-anchor="middle" class="title">注册流程</text><rect x="55" y="90" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="125" text-anchor="middle" class="label">1 进入注册页</text><text x="540" y="162" text-anchor="middle" class="body">登录页点击【立即注册】</text><path d="M540 218v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="245" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="280" text-anchor="middle" class="label">2 填写注册信息</text><text x="540" y="317" text-anchor="middle" class="body">手机号、短信验证码、密码及确认密码</text><text x="540" y="347" text-anchor="middle" class="body">邮箱选填，勾选服务协议</text><path d="M540 373v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="400" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="435" text-anchor="middle" class="label">3 提交注册</text><text x="540" y="472" text-anchor="middle" class="body">错误按提示修改；校验通过后提示注册成功</text><path d="M540 528v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="555" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="590" text-anchor="middle" class="label">4 返回登录</text><text x="540" y="627" text-anchor="middle" class="body">自动跳转登录页，登录后进入【总览】</text></svg>