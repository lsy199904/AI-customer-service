<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><rect width="1080" height="760" fill="white"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#183153}.title{font-size:34px;font-weight:600}.label{font-size:27px;font-weight:600}.body{font-size:24px}</style><text x="540" y="55" text-anchor="middle" class="title">登录流程</text><rect x="55" y="90" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="125" text-anchor="middle" class="label">1 选择登录方式</text><text x="540" y="162" text-anchor="middle" class="body">打开企业服务门户登录页</text><path d="M540 218v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="245" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="280" text-anchor="middle" class="label">2 手机号登录</text><text x="540" y="317" text-anchor="middle" class="body">验证码登录：手机号＋短信验证码</text><text x="540" y="347" text-anchor="middle" class="body">密码登录：手机号＋密码</text><path d="M540 373v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="400" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="435" text-anchor="middle" class="label">3 校验并进入总览</text><text x="540" y="472" text-anchor="middle" class="body">成功后默认进入【总览】</text><path d="M540 528v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="555" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="590" text-anchor="middle" class="label">4 登录失败时</text><text x="540" y="627" text-anchor="middle" class="body">检查手机号和密码，或点击【忘记密码】</text><text x="540" y="657" text-anchor="middle" class="body">通过注册手机号的短信验证码重置密码</text></svg>