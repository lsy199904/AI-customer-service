<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="915" viewBox="0 0 1080 915"><rect width="1080" height="915" fill="white"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#183153}.title{font-size:34px;font-weight:600}.label{font-size:27px;font-weight:600}.body{font-size:24px}</style><text x="540" y="55" text-anchor="middle" class="title">服务订购流程</text><rect x="55" y="90" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="125" text-anchor="middle" class="label">1 核对前置条件</text><text x="540" y="162" text-anchor="middle" class="body">企业认证、签约均已完成</text><path d="M540 218v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="245" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="280" text-anchor="middle" class="label">2 选择套餐</text><text x="540" y="317" text-anchor="middle" class="body">【服务订购】→选择套餐→【立即订购】</text><path d="M540 373v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="400" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="435" text-anchor="middle" class="label">3 选择供应商与模型</text><text x="540" y="472" text-anchor="middle" class="body">可勾选【全选含后续新增】</text><text x="540" y="502" text-anchor="middle" class="body">企业专业版增值服务按需选择</text><path d="M540 528v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="555" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="590" text-anchor="middle" class="label">4 确认提交</text><text x="540" y="627" text-anchor="middle" class="body">同一时间仅能订购1个服务</text><text x="540" y="657" text-anchor="middle" class="body">更换前先取消当前生效服务</text><path d="M540 683v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="710" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="745" text-anchor="middle" class="label">5 查看服务与创建密钥</text><text x="540" y="782" text-anchor="middle" class="body">【前往我的服务】→查看生效、渠道及可用模型</text><text x="540" y="812" text-anchor="middle" class="body">按开通指引创建和管理API Key</text></svg>