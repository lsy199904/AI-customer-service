<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="915" viewBox="0 0 1080 915"><rect width="1080" height="915" fill="white"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#183153}.title{font-size:34px;font-weight:600}.label{font-size:27px;font-weight:600}.body{font-size:24px}</style><text x="540" y="55" text-anchor="middle" class="title">企业认证流程</text><rect x="55" y="90" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="125" text-anchor="middle" class="label">1 完善企业资料</text><text x="540" y="162" text-anchor="middle" class="body">【企业管理】→【编辑企业信息】</text><text x="540" y="192" text-anchor="middle" class="body">企业名称、统一社会信用代码、公司地址，保存</text><path d="M540 218v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="245" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="280" text-anchor="middle" class="label">2 发起认证</text><text x="540" y="317" text-anchor="middle" class="body">【去认证】→核对信息→【立即认证】</text><path d="M540 373v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="400" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="435" text-anchor="middle" class="label">3 e签宝授权与实名</text><text x="540" y="472" text-anchor="middle" class="body">手机号或邮箱接收验证码</text><text x="540" y="502" text-anchor="middle" class="body">同意协议→【登录并授权】→完成实名认证</text><path d="M540 528v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="555" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="590" text-anchor="middle" class="label">4 等待企业管理员审批</text><text x="540" y="627" text-anchor="middle" class="body">可复制授权链接提醒e签宝企业管理员</text><text x="540" y="657" text-anchor="middle" class="body">等待期间门户显示“认证中”</text><path d="M540 683v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="710" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="745" text-anchor="middle" class="label">5 查看认证结果</text><text x="540" y="782" text-anchor="middle" class="body">门户状态显示“已认证”后，继续办理签约</text></svg>