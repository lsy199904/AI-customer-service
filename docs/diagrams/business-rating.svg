<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><rect width="1080" height="760" fill="white"/><style>text{font-family:PingFang SC,Noto Sans CJK SC,sans-serif;fill:#183153}.title{font-size:34px;font-weight:600}.label{font-size:27px;font-weight:600}.body{font-size:24px}</style><text x="540" y="55" text-anchor="middle" class="title">星级评定流程</text><rect x="55" y="90" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="125" text-anchor="middle" class="label">1 默认星级</text><text x="540" y="162" text-anchor="middle" class="body">线上、线下注册客户默认为一星</text><text x="540" y="192" text-anchor="middle" class="body">需要调整时由对应客户经理操作</text><path d="M540 218v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="245" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="280" text-anchor="middle" class="label">2 办理订购</text><text x="540" y="317" text-anchor="middle" class="body">先完成企业认证与签约，再订购套餐和模型</text><path d="M540 373v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="400" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="435" text-anchor="middle" class="label">3 已订购服务的权益调整</text><text x="540" y="472" text-anchor="middle" class="body">28号（含）前提交：次月1日生效</text><text x="540" y="502" text-anchor="middle" class="body">28号后提交：隔月1日生效</text><path d="M540 528v20m-6-6 6 6 6-6" fill="none" stroke="#7c9aca" stroke-width="3"/><rect x="55" y="555" width="970" height="125" rx="15" fill="#f0f6ff" stroke="#b7cef0"/><text x="540" y="590" text-anchor="middle" class="label">4 需要实时生效</text><text x="540" y="627" text-anchor="middle" class="body">联系客户经理或人工客服</text><text x="540" y="657" text-anchor="middle" class="body">由其协调系统管理员处理</text></svg>